<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .hidden-section { display: none; }
        .modal-75 { width: 85vw; height: 75vh; position: fixed; top: 12.5vh; left: 7.5vw; z-index: 100; }
        .admin-glow { border: 2px solid #fbbf24; box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }
        .click-shield { position: absolute; inset: 0; background: rgba(0,0,0,0.05); z-index: 110; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-yellow-600 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-xs font-black text-yellow-500 italic">PAPERHOUSE INC</h1>
            <p id="tg-username" class="text-[10px] text-blue-400 font-mono">@Detecting...</p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-gray-400">BALANCE</p>
            <p class="text-green-400 font-black">₱<span id="balance">0.000</span></p>
        </div>
    </nav>

    <!-- App Container -->
    <main class="p-4 pb-28 max-w-lg mx-auto space-y-4">
        
        <!-- Tabs -->
        <div class="flex bg-gray-800 p-1 rounded-xl">
            <button onclick="showTab('earn')" class="flex-1 py-2 text-xs font-bold rounded-lg bg-gray-700 text-yellow-500">EARN</button>
            <button onclick="showTab('promote')" class="flex-1 py-2 text-xs font-bold rounded-lg">PROMOTE</button>
            <button onclick="showTab('wallet')" class="flex-1 py-2 text-xs font-bold rounded-lg">WALLET</button>
            <button onclick="promptAdmin()" class="flex-1 py-2 text-xs font-bold rounded-lg text-red-400">ADMIN</button>
        </div>

        <!-- Section: Earn -->
        <div id="tab-earn" class="space-y-4">
            <div id="admin-links" class="space-y-2"></div>
            <div id="user-links" class="space-y-2"></div>
        </div>

        <!-- Section: Promote -->
        <div id="tab-promote" class="hidden-section bg-gray-800 p-5 rounded-2xl border border-gray-700 space-y-4">            <h3 class="font-bold border-b border-gray-700 pb-2">Add New Task</h3>
            <select id="link-type" class="w-full bg-gray-900 border border-gray-600 p-3 rounded-lg text-sm">
                <option value="fb_follow">Facebook Follow (₱0.02)</option>
                <option value="web_visit">Website Visit (₱0.02)</option>
                <option value="yt_watch">YouTube Watch (₱0.01)</option>
                <option value="yt_sub">YouTube Subscribe (₱0.03)</option>
            </select>
            <input id="link-url" type="url" placeholder="Paste URL here" class="w-full bg-gray-900 border border-gray-600 p-3 rounded-lg text-sm">
            <textarea id="link-def" placeholder="Task Definition (e.g. Subscribe and turn on bell)" class="w-full bg-gray-900 border border-gray-600 p-3 rounded-lg text-sm h-20"></textarea>
            <button onclick="submitLink()" class="w-full bg-yellow-600 py-3 rounded-xl font-bold text-sm">Create Link</button>
            <p id="quota-msg" class="text-[10px] text-gray-500 text-center uppercase tracking-widest font-bold"></p>
        </div>

        <!-- Section: Wallet -->
        <div id="tab-wallet" class="hidden-section space-y-4">
            <div class="bg-gradient-to-br from-green-900 to-gray-800 p-6 rounded-2xl border border-green-700 text-center">
                <p class="text-xs text-green-300">Available Funds</p>
                <h2 class="text-3xl font-black">₱<span id="wallet-bal">0.00</span></h2>
            </div>
            <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 space-y-3">
                <select id="wd-method" class="w-full bg-gray-900 p-3 rounded-lg text-sm">
                    <option value="GCash">GCash</option>
                    <option value="FaucetPay">FaucetPay (Email)</option>
                    <option value="PayPal">PayPal (Email)</option>
                </select>
                <input id="wd-acc" type="text" placeholder="Account Number / Email" class="w-full bg-gray-900 p-3 rounded-lg text-sm">
                <input id="wd-amt" type="number" min="1" placeholder="Amount (Min ₱1)" class="w-full bg-gray-900 p-3 rounded-lg text-sm">                <button onclick="requestWD()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">Request Withdrawal</button>
            </div>
        </div>

        <!-- Section: Admin (Hidden) -->
        <div id="tab-admin" class="hidden-section space-y-4 bg-gray-800 p-4 rounded-xl">
            <h2 class="font-bold text-red-500 underline">Admin Controls</h2>
            <div class="p-3 bg-black/50 rounded-lg">
                <p class="text-xs font-bold mb-2">Create Global Sponsored Link (100k cap)</p>
                <input id="adm-url" type="url" placeholder="Sponsor URL" class="w-full bg-gray-700 p-2 rounded mb-2 text-xs">
                <input id="adm-def" type="text" placeholder="Definition" class="w-full bg-gray-700 p-2 rounded mb-2 text-xs">
                <button onclick="createAdminLink()" class="w-full bg-red-600 py-2 rounded text-xs font-bold">POST SPONSOR</button>
            </div>
            <div class="space-y-2">
                <p class="text-xs font-bold">Pending Withdrawals</p>
                <div id="admin-wd-list" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <!-- Modal: Website Card (75%) -->
    <div id="web-modal" class="fixed inset-0 bg-black/95 z-[100] hidden">
        <div class="modal-75 bg-white rounded-xl flex flex-col overflow-hidden shadow-2xl">
            <div class="bg-gray-200 p-2 flex justify-between items-center text-gray-800">
                <span id="web-status" class 
="text-[10px] font-bold px-2 py-1 bg-yellow-400 rounded-full">INTERACT TO START (0/3)</span>
                <span id="web-timer" class="font-mono font-bold">15s</span>
            </div>
            <div class="relative flex-1">
                <div id="click-shield" class="click-shield"></div>
                <iframe id="web-frame" src="" class="w-full h-full border-none"></iframe>
            </div>
        </div>
    </div>

    <!-- Modal: Social Task Overlay -->
    <div id="social-modal" class="fixed inset-0 bg-black/95 z-[200] hidden flex flex-col items-center justify-center p-8">
        <div class="w-24 h-24 border-4 border-yellow-500 rounded-full flex items-center justify-center mb-6">
            <span id="social-timer" class="text-3xl font-black">30</span>
        </div>
        <p id="social-status" class="text-yellow-500 font-bold animate-pulse text-center">TASK RUNNING...</p>
        <div class="mt-10 text-[10px] text-gray-500 uppercase leading-relaxed text-center">
            Must follow, like and comment.<br>Returning early will pause the timer.
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
