<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>
    <script src='//libtl.com/sdk.js' data-zone='10830602' data-sdk='show_10830602'></script>
    <script src='//libtl.com/sdk.js' data-zone='10555746' data-sdk='show_10555746'></script>

    <style>
        :root { --main-bg: #1a1a1a; --main-color: #ffffff; --accent: #3b82f6; }
        body { background-color: var(--main-bg); color: var(--main-color); transition: 0.3s; overflow-x: hidden; }
        .sidebar { transform: translateX(-100%); transition: 0.3s ease-in-out; }
        .sidebar.active { transform: translateX(0); }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .hidden-section { display: none; }
    </style>
</head>
<body class="font-sans">

    <!-- Top Bar -->
    <header class="p-4 flex justify-between items-center glass sticky top-0 z-50">
        <button id="menuBtn" class="text-2xl">☰</button>
        <h1 class="font-bold text-lg">PAPERHOUSE INC12</h1>
        <div id="userBar" class="text-sm font-mono bg-blue-600 px-2 py-1 rounded">👤 Loading...</div>
    </header>

    <!-- Sliding Menu -->
    <nav id="sidebar" class="fixed left-0 top-0 h-full w-64 sidebar glass z-[60] p-5 flex flex-col gap-4">
        <button id="closeBtn" class="text-right text-xl">✕</button>
        <button onclick="showSection('home')" class="py-2 hover:bg-blue-500 rounded px-2 text-left">🏠 Home</button>
        <button onclick="showSection('tasks')" class="py-2 hover:bg-blue-500 rounded px-2 text-left">✅ Tasks</button>
        <button onclick="showSection('chat')" class="py-2 hover:bg-blue-500 rounded px-2 text-left">💬 Global Chat</button>
        <button onclick="showSection('topics')" class="py-2 hover:bg-blue-500 rounded px-2 text-left">📚 Topics</button>
        <button onclick="showSection('users')" class="py-2 hover:bg-blue-500 rounded px-2 text-left">👥 Users Online</button>

        <div class="mt-auto border-t pt-4">
            <p class="text-xs mb-2">Pick Theme Color:</p>
            <input type="color" id="colorPicker" class="w-full h-8 cursor-pointer rounded">
        </div>
    </nav>

    <!-- Main Content -->
    <main class="p-4 mb-20">
        
        <!-- Home Section -->
        <section id="home-section">
            <div class="bg-blue-900/30 p-6 rounded-xl border border-blue-500 mb-4">
                <h2 class="text-2xl font-bold">Welcome!</h2>
                <p>Watch <span id="adCountDisplay" class="text-yellow-400">0</span>/27 Ads to post links.</p>
                <button onclick="watchMandatoryAd()" class="mt-4 bg-yellow-500 text-black font-bold py-2 px-4 rounded shadow-lg hover:scale-105 active:scale-95 transition">
                    Watch Ad (Earn Progress)
                </button>
            </div>
        </section>

        <!-- Tasks Section -->
        <section id="tasks-section" class="hidden-section">
            <h2 class="text-xl font-bold mb-4">Post Link (1 Free Daily)</h2>
            <div id="postLinkForm" class="bg-gray-800 p-4 rounded-lg mb-6">
                <input type="text" id="tgLinkInput" placeholder="https://t.me/yourlink" class="w-full p-2 rounded bg-gray-700 text-white mb-2">
                <p id="cooldownMsg" class="text-red-400 text-xs mb-2"></p>
                <button onclick="handlePostLink()" class="w-full bg-green-600 py-2 rounded font-bold">Post Link</button>
            </div>
            <div id="taskList" class="grid gap-3">
                <!-- Links appear here -->
            </div>
        </section>

        <!-- Chat Section -->
        <section id="chat-section" class="hidden-section">
            <div id="chatBox" class="h-96 overflow-y-auto bg-black/20 p-3 rounded mb-2 border border-white/10"></div>
            <div class="flex gap-2">
                <input type="text" id="chatInput" class="flex-1 p-2 rounded bg-gray-800" placeholder="Type a message...">
                <button onclick="sendMessage()" class="bg-blue-600 px-4 rounded">Send</button>
            </div>
        </section>

        <!-- Topics Section -->
        <section id="topics-section" class="hidden-section">
            <button onclick="openTopicModal()" class="w-full bg-purple-600 py-2 rounded mb-4 font-bold">+ Create Topic</button>
            <div id="topicList" class="space-y-4"></div>
        </section>

        <!-- Users List -->
        <section id="users-section" class="hidden-section">
            <h2 class="text-xl mb-4">Online Users</h2>
            <ul id="onlineList" class="divide-y divide-gray-700"></ul>
        </section>

    </main>

    <!-- Footer -->
    <footer class="fixed bottom-0 w-full glass p-3 text-center text-xs">
        <div id="footerDateTime"></div>
        <p class="opacity-50">© 2024 PAPERHOUSE INC12</p>
    </footer>

    <!-- Topic Modal -->
    <div id="topicModal" class="fixed inset-0 bg-black/80 hidden z-[100] p-6">
        <div class="bg-gray-800 p-4 rounded-xl max-w-md mx-auto mt-10">
            <h3 class="text-lg font-bold mb-3">New Topic</h3>
            <input type="text" id="topicTitle" placeholder="Topic Title" class="w-full p-2 mb-2 bg-gray-700 rounded">
            <textarea id="topicDesc" placeholder="Description" class="w-full p-2 mb-2 bg-gray-700 rounded h-24"></textarea>
            <input type="file" id="topicImg" accept="image/*" class="mb-4 text-xs">
            <div class="flex gap-2">
                <button onclick="submitTopic()" class="bg-green-600 flex-1 py-2 rounded">Post</button>
                <button onclick="closeTopicModal()" class="bg-red-600 px-4 rounded">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
