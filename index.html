<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <!-- Ad SDK -->
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>
    <script src='//libtl.com/sdk.js' data-zone='10830602' data-sdk='show_10830602'></script>
    <script src='//libtl.com/sdk.js' data-zone='10555746' data-sdk='show_10555746'></script>

    <style>
        :root { --main-bg: #1a1a1a; --main-color: #ffffff; }
        body { background-color: var(--main-bg); color: var(--main-color); transition: 0.3s; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
        .hidden-task { display: none !important; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header -->
    <header class="p-4 glass sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold">PAPERHOUSE INC12</h1>
        <div id="user-display" class="text-sm font-mono bg-blue-600 px-3 py-1 rounded-full">Loading...</div>
    </header>

    <main class="p-4 space-y-6">
        
        <!-- Theme Picker -->
        <section class="glass p-4 rounded-xl">
            <h2 class="text-sm font-semibold mb-2">Personalize</h2>
            <div class="flex gap-4">
                <div>
                    <label class="text-xs">Background</label>
                    <input type="color" id="bgColor" class="block w-10 h-10 rounded cursor-pointer" value="#1a1a1a">
                </div>
                <div>
                    <label class="text-xs">Text Color</label>
                    <input type="color" id="textColor" class="block w-10 h-10 rounded cursor-pointer" value="#ffffff">
                </div>
            </div>
        </section>

        <!-- Stats & Ads Section -->
        <section class="glass p-4 rounded-xl text-center">
            <div class="text-3xl font-bold" id="ad-count">0 / 27</div>
            <p class="text-xs opacity-70">Ads watched to unlock posting</p>

            <button onclick="watchAd()" class="mt-3 bg-green-600 hover:bg-green-500 px-6 py-2 rounded-lg font-bold w-full transition">WATCH AD</button>
        </section>

        <!-- Task Section -->
        <section id="task-section" class="space-y-4">
            <div class="glass p-4 rounded-xl">
                <h2 class="font-bold mb-3">Post Link (12h Cooldown)</h2>
                <input type="text" id="task-link" placeholder="https://t.me/..." class="w-full p-2 rounded bg-black/20 border border-white/20 mb-2">
                <button onclick="submitTask()" id="btn-submit" class="w-full bg-blue-600 py-2 rounded font-bold opacity-50 cursor-not-allowed" disabled>Submit Task</button>
                <p id="cooldown-timer" class="text-xs mt-2 text-red-400"></p>
            </div>

            <div class="space-y-2">
                <h2 class="font-bold">Available Tasks</h2>
                <div id="tasks-container" class="space-y-2">
                    <!-- Tasks injected here -->
                </div>
            </div>
        </section>

        <!-- Users Online -->
        <section class="glass p-4 rounded-xl">
            <h2 class="font-bold mb-2">Online Users</h2>
            <div id="online-users" class="flex flex-wrap gap-2 text-xs"></div>
        </section>

        <!-- Chat Section -->
        <section class="glass p-4 rounded-xl flex flex-col h-[400px]">
            <h2 class="font-bold mb-2">Global Chat</h2>
            <div id="chat-box" class="flex-grow overflow-y-auto space-y-2 mb-2 p-2 bg-black/10 rounded"></div>
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Type message..." class="flex-grow p-2 rounded bg-black/20 border border-white/20">
                <button onclick="sendMessage()" class="bg-blue-500 px-4 py-2 rounded">Send</button>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="fixed bottom-0 w-full glass p-2 text-center text-xs">
        <div id="footer-date"></div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
