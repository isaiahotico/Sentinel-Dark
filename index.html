<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAPERHOUSE INC12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
    <!-- Monetag SDKs -->
    <script src='//libtl.com/sdk.js' data-zone='10555663' data-sdk='show_10555663'></script>
    <script src='//libtl.com/sdk.js' data-zone='10830602' data-sdk='show_10830602'></script>
    <script src='//libtl.com/sdk.js' data-zone='10555746' data-sdk='show_10555746'></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main-bg: #1a1a1a; --accent-color: #3b82f6; }
        body { background-color: var(--main-bg); color: white; transition: 0.3s; }
        .sidebar { transition: 0.3s transform ease-in-out; }
        .hidden-link { display: none; }
        .topic-image { max-width: 200px; max-height: 150px; border-radius: 8px; margin-top: 8px; }
        #post-area { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="font-sans pb-20">

    <!-- Header -->
    <header class="p-4 flex justify-between items-center bg-gray-900 shadow-xl sticky top-0 z-50">
        <button onclick="toggleMenu()" class="text-2xl md:hidden">☰</button>
        <h1 class="font-bold text-xl ml-4 md:ml-0">PAPERHOUSE INC12</h1>
        <div id="user-display" class="text-blue-400 font-mono text-sm">@Guest</div>
    </header>

    <!-- Sliding Menu -->
    <div id="sidebar" class="sidebar fixed top-0 left-0 h-full w-64 bg-gray-800 z-[60] -translate-x-full md:translate-x-0 p-5 shadow-2xl">
        <button onclick="toggleMenu()" class="absolute top-4 right-4 text-xl md:hidden">✕</button>
        <h2 class="text-xl font-bold mb-8 mt-4">Navigation</h2>
        <nav class="space-y-4">
            <button onclick="showSection('tasks')" class="block w-full text-left p-2 hover:bg-gray-700 rounded">📋 Tasks Section</button>
            <button onclick="showSection('topics')" class="block w-full text-left p-2 hover:bg-gray-700 rounded">📚 Topics</button>            <button onclick="showSection('chat')" class="block w-full text-left p-2 hover:bg-gray-700 rounded">💬 Global Chat</button>
            <button onclick="showSection('users')" class="block w-full text-left p-2 hover:bg-gray-700 rounded">👥 Online Users</button>
            <button onclick="showSection('settings')" class="block w-full text-left p-2 hover:bg-gray-700 rounded">🎨 Settings</button>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="p-4 md:ml-64 max-w-3xl mx-auto">
        
        <!-- Stats Bar -->
        <div class="bg-gray-800 p-4 rounded-lg mb-6 flex justify-around border border-gray-700">
            <div class="text-center">
                <p class="text-xs text-gray-400">Ads Watched</p>
                <p id="ad-count" class="text-xl font-bold">0/27</p>
            </div>
            <div class="text-center">
                <p class="text-xs text-gray-400">Post Status</p>
                <p id="qualify-status" class="text-xs text-red-500 font-bold uppercase">Not Qualified</p>
            </div>
        </div>

        <!-- Sections -->
        <section id="tasks-section" class="content-section">
            <div id="post-area" class="bg-gray-800 p-4 rounded-lg mb-4">
                <h3 class="font-bold mb-2">Post Your Link</h3>
                <input type="text" id="tg-link" placeholder="https://t.me/yourlink" class="w-full p-2 rounded bg-gray-700 mb-2 border border-gray-600 outline-none">
                <button onclick="postLink()" id="post-btn" class="w-full bg-blue-600 p-2 rounded font-bold hover:bg-blue-700 disabled:opacity-50">Post (Requires 27 Ads)</button>
                <p id="cooldown-timer" class="text-xs mt-2 text-yellow-500 text-center"></p>
            </div>
            <div id="links-container" class="space-y-3">
                <!-- Links appear here -->
            </div>
        </section>

        <section id="topics-section" class="content-section hidden">
            <div class="bg-gray-800 p-4 rounded-lg mb-4">
                <button onclick="showCreateTopicForm()" class="bg-blue-600 px-4 py-2 rounded font-bold mb-4">Create New Topic</button>                <div id="create-topic-form" class="hidden bg-gray-700 p-4 rounded-lg mb-4">
                    <input type="text" id="topic-title" placeholder="Topic Title" class="w-full p-2 rounded bg-gray-800 mb-2 border border-gray-600 outline-none">
                    <textarea id="topic-description" placeholder="Topic Description" rows="3" class="w-full p-2 rounded bg-gray-800 mb-2 border border-gray-600 outline-none"></textarea>
                    <input type="file" id="topic-image" accept="image/*" class="mb-2 text-sm">
                    <button onclick="createTopic()" class="bg-green-600 px-4 py-2 rounded font-bold">Create</button>
                    <button onclick="hideCreateTopicForm()" class="ml-2 px-4 py-2 rounded bg-gray-600">Cancel</button>
                </div>
                <div id="topics-list" class="space-y-4">
                    <!-- Topics will be loaded here -->
                </div>
            </div>
        </section>

        <section id="chat-section" class="content-section hidden">
            <div class="bg-gray-800 p-4 rounded-lg h-[400px] flex flex-col">
                <div id="chat-messages" class="flex-grow overflow-y-auto mb-4 space-y-2 p-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="chat-input" class="flex-grow p-2 rounded bg-gray-700 outline-none" placeholder="Type message...">
                    <button onclick="sendMessage()" class="bg-blue-600 px-4 rounded">Send</button></div>
            </div>
        </section>

        <section id="users-section" class="content-section hidden">
            <div class="bg-gray-800 p-4 rounded-lg">
                <h3 class="font-bold mb-4">Online Users</h3>
                <ul id="user-list" class="space-y-2"></ul>
            </div>
        </section>

        <section id="settings-section" class="content-section hidden">
            <div class="bg-gray-800 p-4 rounded-lg">
                <h3 class="font-bold mb-4">Personalization</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm mb-1">Background Color</label>
                        <input type="color" id="bg-picker" onchange="updateColors()" class="w-full h-10 rounded cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm mb-1">Accent Color</label>
                        <input type="color" id="accent-picker" onchange="updateColors()" class="w-full h-10 rounded cursor-pointer">
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Ad Trigger Button (Floating) -->
    <button onclick="watchAdsTogether()" id="ad-trigger-btn" class="fixed bottom-20 right-4 bg-green-600 w-16 h-16 rounded-full shadow-2xl font-bold flex items-center justify-center animate-bounce border-4 border-white z-50">
        ADS
    </button>

    <!-- Footer -->
    <footer class="fixed bottom-0 w-full bg-gray-900 p-3 text-center text-xs border-t border-gray-800">
        <p id="footer-time-date"></p>
        <p class="text-gray-500 mt-1">PAPERHOUSE INC12 © 2024</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
